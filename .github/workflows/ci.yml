name: CI
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.14.1'
          cabal-version: 'latest'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/packages
            ~/.cabal/store
            dist-newstyle
          key: ${{ runner.os }}-cabal-${{ hashFiles('**/*.cabal', 'cabal.project') }}
      - name: Build
        run: cabal build all
      - name: Test
        run: cabal test all
      - name: Install lint tools
        run: cabal install hlint fourmolu --overwrite-policy=always
      - name: HLint
        run: hlint src app test bench
      - name: Fourmolu check
        run: fourmolu --mode check src app test bench
